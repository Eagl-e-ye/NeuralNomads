<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elyx Concierge Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; /* slate-100 */
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b; /* slate-800 */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8; /* slate-400 */
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* slate-500 */
        }
        /* Simple fade-in animation for messages */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.1s ease-out forwards;
        }
        /* Highlighting effect for messages */
        .highlight-message > div { /* Target the bubble directly */
            transition: background-color 0.3s ease-in-out;
            background-color: #93c5fd !important; /* blue-300 */
        }
        .dark .highlight-message > div {
            background-color: #1e40af !important; /* blue-800 */
        }
        .highlight-message > div p {
             color: #1e293b !important; /* slate-800 */
        }
        .dark .highlight-message > div p {
             color: #f8fafc !important; /* slate-50 */
        }
        /* Search highlight effect */
        .search-highlight > div {
            background-color: rgba(74, 222, 128, 0.4) !important; /* green-400 with opacity */
        }
        .dark .search-highlight > div {
             background-color: rgba(74, 222, 128, 0.25) !important;
        }

        /* Modal specific styling */
        .modal {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .chart-container {
            position: relative;
            height: 40vh; /* Responsive height */
            width: 100%;
        }

        /* New styles for the reason modal */
        #reason-modal {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl h-[90vh] flex bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">

        <!-- Main Chat Panel -->
        <div class="flex-1 flex flex-col">
            <header class="bg-gray-200 dark:bg-slate-700 p-4 flex items-center justify-between shadow-md z-10 flex-shrink-0">
                <div class="flex items-center">
                    <img id="header-avatar" src="https://placehold.co/40x40/7e22ce/white?text=R" alt="Avatar" class="w-10 h-10 rounded-full mr-4">
                    <div>
                        <h1 id="header-name" class="text-lg font-bold text-gray-800 dark:text-white">Rohan & Elyx Team</h1>
                        <p id="header-status" class="text-sm text-gray-600 dark:text-gray-400">Full Conversation History</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                     <button id="view-trends-btn" class="p-2 rounded-full hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M7 12l2-2 2 2 2-2 2 2m-2-2V7m-4 12h8a2 2 0 002-2V7a2 2 0 00-2-2H9a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                     </button>
                     <button id="view-stats-btn" class="p-2 rounded-full hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.055A9.001 9.001 0 0120.488 9z" />
                        </svg>
                     </button>
                     <button id="decisions-toggle" class="p-2 rounded-full hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                             <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m-5 4h4a2 2 0 002-2V6a2 2 0 00-2-2H9a2 2 0 00-2 2v10a2 2 0 002 2z" />
                         </svg>
                     </button>
                </div>
            </header>

            <main id="chat-window" class="flex-1 p-4 overflow-y-auto custom-scrollbar bg-gray-100 dark:bg-slate-900">
                 <div id="initial-message" class="flex justify-center items-center h-full">
                    <div class="text-center p-6">
                        <p class="text-gray-500 dark:text-gray-400">Loading chat history...</p>
                    </div>
                </div>
            </main>

            <footer class="bg-gray-200 dark:bg-slate-700 p-3 flex flex-col space-y-2">
                <div class="relative w-full">
                    <input type="text" id="search-input" placeholder="Search messages..." class="w-full bg-gray-100 dark:bg-slate-600 border-transparent focus:border-transparent focus:ring-0 rounded-full py-2 pl-10 pr-4 text-gray-800 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                </div>
                <div id="nav-footer" class="w-full flex items-center justify-center space-x-4 hidden">
                    <button id="prev-btn" class="p-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                        </svg>
                    </button>
                    <span id="nav-counter" class="text-sm font-medium text-gray-700 dark:text-gray-300"></span>
                    <button id="next-btn" class="p-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                </div>
            </footer>
        </div>

        <!-- Decisions Panel -->
        <aside id="decisions-panel" class="w-80 bg-gray-50 dark:bg-slate-700 border-l border-gray-200 dark:border-slate-600 p-4 transition-transform duration-300 transform translate-x-full hidden lg:block">
            <h2 class="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700 dark:text-gray-200 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m-5 4h4a2 2 0 002-2V6a2 2 0 00-2-2H9a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Key Decisions
            </h2>
            <div id="decisions-list" class="space-y-4 custom-scrollbar overflow-y-auto h-[calc(100%-48px)] pr-2">
                <!-- Decision items will be populated here -->
            </div>
        </aside>
    </div>

    <!-- The new modal for data visualization -->
    <div id="chart-modal" class="fixed inset-0 z-50 flex items-center justify-center modal hidden">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-4xl h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 id="chart-title" class="text-2xl font-bold text-gray-800 dark:text-white">Patient Data Trends</h2>
                <button id="close-modal-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="chart-controls" class="flex flex-wrap gap-2 mb-4">
                <!-- Buttons to select the chart will be added here dynamically -->
            </div>
            <div id="chart-canvas-container" class="flex-1 relative overflow-y-auto custom-scrollbar">
                <!-- The canvas for the chart will be rendered here -->
            </div>
        </div>
    </div>

    <!-- The new modal for conversation statistics -->
    <div id="stats-modal" class="fixed inset-0 z-50 flex items-center justify-center modal hidden">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-4xl h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 id="stats-title" class="text-2xl font-bold text-gray-800 dark:text-white">Conversation Statistics</h2>
                <button id="close-stats-modal-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="stats-controls" class="flex flex-wrap gap-2 mb-4">
                <button data-stat-id="doctor-avg" class="py-2 px-4 rounded-full font-medium text-sm bg-blue-500 dark:bg-blue-600 text-white transition-colors">Doctor Averages</button>
                <button data-stat-id="weekly-avg" class="py-2 px-4 rounded-full font-medium text-sm bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">Weekly Average</button>
                <button data-stat-id="monthly-avg" class="py-2 px-4 rounded-full font-medium text-sm bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">Monthly Average</button>
            </div>
            <div id="stats-content" class="flex-1 overflow-y-auto custom-scrollbar">
                <!-- Statistics will be displayed here -->
            </div>
        </div>
    </div>

    <!-- Decision Reason Modal -->
    <div id="reason-modal" class="fixed inset-0 z-50 flex items-center justify-center modal hidden">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800 dark:text-white">Decision Reason</h2>
                <button id="close-reason-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="overflow-y-auto custom-scrollbar">
                <p id="reason-text" class="text-base text-gray-700 dark:text-gray-300"></p>
            </div>
        </div>
    </div>

    <script>
        // --- MAIN APPLICATION SCRIPT ---
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const chatWindow = document.getElementById('chat-window');
            const headerAvatar = document.getElementById('header-avatar');
            const headerName = document.getElementById('header-name');
            const headerStatus = document.getElementById('header-status');
            const navFooter = document.getElementById('nav-footer');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const navCounter = document.getElementById('nav-counter');
            const searchInput = document.getElementById('search-input');
            const initialMessage = document.getElementById('initial-message');
            const decisionsToggleBtn = document.getElementById('decisions-toggle');
            const decisionsPanel = document.getElementById('decisions-panel');
            const decisionsList = document.getElementById('decisions-list');
            const viewTrendsBtn = document.getElementById('view-trends-btn');
            const viewStatsBtn = document.getElementById('view-stats-btn');
            const chartModal = document.getElementById('chart-modal');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const chartControls = document.getElementById('chart-controls');
            const chartCanvasContainer = document.getElementById('chart-canvas-container');
            const statsModal = document.getElementById('stats-modal');
            const closeStatsModalBtn = document.getElementById('close-stats-modal-btn');
            const statsControls = document.getElementById('stats-controls');
            const statsContent = document.getElementById('stats-content');
            const reasonModal = document.getElementById('reason-modal');
            const reasonText = document.getElementById('reason-text');
            const closeReasonBtn = document.getElementById('close-reason-btn');


            // App State
            let allMessages = [];
            let expertDetails = {};
            let highlightedElements = [];
            let currentHighlightIndex = 0;
            let searchResultElements = [];
            let currentSearchIndex = 0;
            let patientData = [];
            let conversationData = [];
            let decisionsData = [];
            let currentChart = null;
            let charts = {};

            const expertColors = {
                'Ruby': 'text-red-500 dark:text-red-400',
                'Dr. Warren': 'text-blue-500 dark:text-blue-400',
                'Advik': 'text-green-500 dark:text-green-400',
                'Carla': 'text-orange-500 dark:text-orange-400',
                'Rachel': 'text-purple-500 dark:text-purple-400',
                'Neel': 'text-gray-500 dark:text-gray-400'
            };

            const createMessageElement = (message) => {
                const messageWrapper = document.createElement('div');
                messageWrapper.dataset.conversationId = message.expertId || message.recipientId;
                messageWrapper.dataset.messageId = message.message_id; // Add message ID for linking
                messageWrapper.className = 'flex flex-col mb-4 animate-fade-in p-1 rounded-lg';

                const messageBubble = document.createElement('div');
                messageBubble.className = 'max-w-xs lg:max-w-md p-3 rounded-lg shadow-md';

                const messageText = document.createElement('p');
                messageText.className = 'text-sm';
                messageText.innerText = message.text;

                const messageTime = document.createElement('p');
                messageTime.className = 'text-xs mt-1 text-right';
                // Update this line to use the timestamp and format the time
                const timestampDate = new Date(message.timestamp);
                messageTime.innerText = timestampDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                if (message.type === 'sent') {
                    messageWrapper.classList.add('items-end');
                    messageBubble.classList.add('bg-blue-500', 'text-white');
                    messageTime.classList.add('text-blue-100');
                } else {
                    messageWrapper.classList.add('items-start');
                    messageBubble.classList.add('bg-white', 'dark:bg-slate-600', 'text-gray-800', 'dark:text-white');
                    messageTime.classList.add('text-gray-400', 'dark:text-gray-300');

                    const actorName = document.createElement('p');
                    actorName.className = `text-sm font-bold mb-1 ${expertColors[message.actor] || 'text-gray-500'}`;
                    actorName.innerText = message.actor;
                    messageWrapper.appendChild(actorName);
                }

                messageBubble.appendChild(messageText);
                messageBubble.appendChild(messageTime);
                messageWrapper.appendChild(messageBubble);
                return messageWrapper;
            };

            const createDateSeparator = (date) => {
                const separatorWrapper = document.createElement('div');
                separatorWrapper.className = 'flex justify-center my-4';
                separatorWrapper.innerHTML = `
                    <div class="bg-gray-200 dark:bg-slate-700 text-gray-600 dark:text-gray-300 text-xs font-semibold px-3 py-1 rounded-full">
                        ${new Date(date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                    </div>
                `;
                return separatorWrapper;
            };

            const startChatSimulation = (messages) => {
                chatWindow.innerHTML = ''; // Clear the "loading" message
                let messageIndex = 0;
                let lastDate = null;

                const addMessage = () => {
                    if (messageIndex < messages.length) {
                        const message = messages[messageIndex];

                        const messageDate = new Date(message.date).toDateString();
                        if (messageDate !== lastDate) {
                            chatWindow.appendChild(createDateSeparator(message.date));
                            lastDate = messageDate;
                        }

                        const messageElement = createMessageElement(message);
                        chatWindow.appendChild(messageElement);
                        chatWindow.scrollTop = chatWindow.scrollHeight;

                        messageIndex++;
                        setTimeout(addMessage, 100); // Add next message after 0.1 seconds
                    } else {
                        console.log("Chat simulation complete.");
                    }
                };
                addMessage();
            };

            const updateNavControls = () => {
                const elements = searchInput.value ? searchResultElements : highlightedElements;
                let index = searchInput.value ? currentSearchIndex : currentHighlightIndex;

                if (elements.length > 0) {
                    navCounter.textContent = `${index + 1} of ${elements.length}`;
                    prevBtn.disabled = index === 0;
                    nextBtn.disabled = index === elements.length - 1;
                }
            };

            const handleSearch = (query) => {
                const searchTerm = query.toLowerCase();
                const allMessageElements = document.querySelectorAll('.flex.flex-col.mb-4');
                searchResultElements = [];

                allMessageElements.forEach(el => {
                    const textElement = el.querySelector('.text-sm');
                    if (textElement) {
                        const messageText = textElement.innerText.toLowerCase();
                        if (searchTerm && messageText.includes(searchTerm)) {
                            el.classList.add('search-highlight');
                            searchResultElements.push(el);
                        } else {
                            el.classList.remove('search-highlight');
                        }
                    }
                });

                if (searchResultElements.length > 0) {
                    currentSearchIndex = 0;
                    navFooter.classList.remove('hidden');
                    searchResultElements[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    updateNavControls();
                } else {
                    if (!document.querySelector('.highlight-message')) {
                         navFooter.classList.add('hidden');
                    }
                }
            };

            const processData = (rawData) => {
                expertDetails = {
                    'Ruby': { id: 'ruby', name: 'Ruby (Concierge)', avatar: 'https://placehold.co/40x40/f43f5e/white?text=R', status: 'Online' },
                    'Dr. Warren': { id: 'dr_warren', name: 'Dr. Warren', avatar: 'https://placehold.co/40x40/3b82f6/white?text=W', status: 'Available by appointment' },
                    'Advik': { id: 'advik', name: 'Advik (Performance)', avatar: 'https://placehold.co/40x40/10b981/white?text=A', status: 'Analyzing data' },
                    'Carla': { id: 'carla', name: 'Carla (Nutritionist)', avatar: 'https://placehold.co/40x40/f97316/white?text=C', status: 'Online' },
                    'Rachel': { id: 'rachel', name: 'Rachel (PT)', avatar: 'https://placehold.co/40x40/8b5cf6/white?text=R', status: 'In a session' },
                    'Neel': { id: 'neel', name: 'Neel (Lead)', avatar: 'https://placehold.co/40x40/64748b/white?text=N', status: 'Away' }
                };

                const conversationMap = {};
                rawData.forEach(msg => {
                    if (msg.message_id.endsWith('_reply')) {
                        const baseId = msg.message_id.replace('_reply', '');
                        if (expertDetails[msg.actor]) {
                            conversationMap[baseId] = expertDetails[msg.actor].id;
                        }
                    }
                });

                const messagesWithIds = rawData.map(msg => {
                    const baseId = msg.message_id.replace('_reply', '').replace('_followup', '');
                    const conversationPartnerId = conversationMap[baseId];

                    let expertId = null;
                    let recipientId = null;

                    if (msg.actor === 'Rohan') {
                        recipientId = conversationPartnerId;
                    } else if (expertDetails[msg.actor]) {
                        expertId = expertDetails[msg.actor].id;
                    }

                    return { ...msg, recipientId, expertId };
                });

                allMessages = messagesWithIds
                    .map(msg => ({...msg, type: msg.actor === 'Rohan' ? 'sent' : 'received'}))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
            };

            const renderDecisionsPanel = (decisions) => {
                decisionsList.innerHTML = '';
                decisions.forEach(decision => {
                    const decisionItem = document.createElement('button');
                    decisionItem.className = 'w-full text-left p-3 bg-white dark:bg-slate-800 rounded-xl shadow hover:bg-gray-100 dark:hover:bg-slate-600 transition-colors cursor-pointer';
                    decisionItem.innerHTML = `
                        <div class="text-sm font-bold text-gray-800 dark:text-white">${decision.summary}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${new Date(decision.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                    `;
                    decisionItem.addEventListener('click', () => {
                        scrollToDecision(decision);
                    });
                    decisionsList.appendChild(decisionItem);
                });
            };

            const scrollToDecision = (decision) => {
                // Clear any existing highlights
                document.querySelectorAll('.highlight-message, .search-highlight').forEach(el => el.classList.remove('highlight-message', 'search-highlight'));

                const targetId = decision.evidence_message_ids[decision.evidence_message_ids.length - 1]; // Use the last message ID as the target
                const targetElement = document.querySelector(`[data-message-id="${targetId}"]`);

                if (targetElement) {
                    targetElement.classList.add('highlight-message');
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Show the reason modal with a slight delay to allow the scroll to happen
                    setTimeout(() => {
                        reasonText.textContent = decision.reason;
                        reasonModal.classList.remove('hidden');
                    }, 500); // 500ms delay
                } else {
                    console.error(`Message with ID '${targetId}' not found.`);
                    // You could also add a user-facing message here
                }
            };

            // This is the updated function to fetch and process data
            const initializeApp = async () => {
                try {
                    // Fetch the JSON files
                    const [chatResponse, decisionsResponse, patientDataResponse, conversationDataResponse] = await Promise.all([
                        fetch('chats.json'),
                        fetch('decisions.json'),
                        fetch('patient_snapshots.json'),
                        fetch('conversation_duration.json') // Fetch the new file
                    ]);

                    if (!chatResponse.ok) {
                        throw new Error(`HTTP error! status: ${chatResponse.status} for chats.json`);
                    }
                    if (!decisionsResponse.ok) {
                        throw new Error(`HTTP error! status: ${decisionsResponse.status} for decisions.json`);
                    }
                    if (!patientDataResponse.ok) {
                         throw new Error(`HTTP error! status: ${patientDataResponse.status} for patient_snapshots.json`);
                    }
                    if (!conversationDataResponse.ok) {
                         throw new Error(`HTTP error! status: ${conversationDataResponse.status} for conversation_duration.json`);
                    }

                    const rawChatData = await chatResponse.json();
                    decisionsData = await decisionsResponse.json();
                    const rawPatientData = await patientDataResponse.json();
                    conversationData = await conversationDataResponse.json(); // Store the fetched data

                    // Process patient data to remove duplicates and prepare for charts
                    const uniqueDates = {};
                    rawPatientData.forEach(item => {
                        uniqueDates[item.date] = item;
                    });
                    patientData = Object.values(uniqueDates).sort((a,b) => new Date(a.date) - new Date(b.date));

                    processData(rawChatData);
                    startChatSimulation(allMessages);
                    renderDecisionsPanel(decisionsData);
                } catch (error) {
                    console.error("Could not load app data:", error);
                    // Display a user-friendly error message on the page
                    chatWindow.innerHTML = `<div class="text-center text-red-500 dark:text-red-400 p-6">Failed to load chat data. Please ensure 'chats.json', 'decisions.json', 'patient_snapshots.json', and 'conversation_duration.json' are in the same directory.</div>`;
                }
            };

            // --- Charting Functions ---
            const createChart = (id, config) => {
                const canvas = document.createElement('canvas');
                canvas.id = id;
                canvas.className = 'w-full h-full';
                chartCanvasContainer.appendChild(canvas);
                return new Chart(canvas, config);
            };

            const destroyCurrentChart = () => {
                if (currentChart) {
                    currentChart.destroy();
                    currentChart = null;
                }
                chartCanvasContainer.innerHTML = '';
            };

            const showChart = (chartId) => {
                if (charts[chartId]) {
                    destroyCurrentChart();
                    currentChart = createChart(chartId, charts[chartId]);
                }
            };

            const generateChartData = () => {
                if (patientData.length === 0) return;

                const dates = patientData.map(d => {
                    const date = new Date(d.date);
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric'});
                });

                // Blood Pressure Chart Data
                const systolicData = patientData.map(d => parseFloat(d.bp.split('/')[0]));
                const diastolicData = patientData.map(d => parseFloat(d.bp.split('/')[1]));

                charts.bp = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Systolic BP',
                                data: systolicData,
                                borderColor: 'rgb(59, 130, 246)',
                                backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                tension: 0.3,
                                fill: false,
                                pointBorderColor: 'rgb(59, 130, 246)',
                                pointBackgroundColor: 'rgb(59, 130, 246)'
                            },
                            {
                                label: 'Diastolic BP',
                                data: diastolicData,
                                borderColor: 'rgb(251, 146, 60)',
                                backgroundColor: 'rgba(251, 146, 60, 0.2)',
                                tension: 0.3,
                                fill: false,
                                pointBorderColor: 'rgb(251, 146, 60)',
                                pointBackgroundColor: 'rgb(251, 146, 60)'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Blood Pressure Trend' }
                        }
                    }
                };

                // Heart Rate Chart Data
                const hrData = patientData.map(d => d.hr);
                charts.hr = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Heart Rate',
                                data: hrData,
                                borderColor: 'rgb(167, 139, 250)',
                                backgroundColor: 'rgba(167, 139, 250, 0.2)',
                                tension: 0.3,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Heart Rate Trend' }
                        }
                    }
                };

                // Weight Chart Data
                const weightData = patientData.map(d => d.weight);
                charts.weight = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Weight',
                                data: weightData,
                                borderColor: 'rgb(74, 222, 128)',
                                backgroundColor: 'rgba(74, 222, 128, 0.2)',
                                tension: 0.3,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Weight Trend' }
                        }
                    }
                };

                // Sleep Duration Chart Data
                const sleepDurationData = patientData.map(d => d.sleep.duration);
                charts.sleep = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Sleep Duration',
                                data: sleepDurationData,
                                borderColor: 'rgb(244, 63, 94)',
                                backgroundColor: 'rgba(244, 63, 94, 0.2)',
                                tension: 0.3,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Sleep Duration Trend' }
                        }
                    }
                };

                // New charts from updated data
                // Cholesterol
                const totalCholesterolData = patientData.map(d => d['Total Cholesterol']);
                const ldlData = patientData.map(d => d.LDL);
                const hdlData = patientData.map(d => d.HDL);
                const triglyceridesData = patientData.map(d => d.Triglycerides);

                charts.cholesterol = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Total Cholesterol',
                                data: totalCholesterolData,
                                borderColor: 'rgb(255, 99, 132)',
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'LDL',
                                data: ldlData,
                                borderColor: 'rgb(54, 162, 235)',
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'HDL',
                                data: hdlData,
                                borderColor: 'rgb(75, 192, 192)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'Triglycerides',
                                data: triglyceridesData,
                                borderColor: 'rgb(153, 102, 255)',
                                backgroundColor: 'rgba(153, 102, 255, 0.2)',
                                tension: 0.3,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Cholesterol & Triglycerides' }
                        }
                    }
                };

                // Blood Sugar
                const fastingGlucoseData = patientData.map(d => d['Fasting Glucose']);
                const hba1cData = patientData.map(d => d.HbA1c);
                charts.glucose = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'Fasting Glucose',
                                data: fastingGlucoseData,
                                borderColor: 'rgb(255, 159, 64)',
                                backgroundColor: 'rgba(255, 159, 64, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'HbA1c',
                                data: hba1cData,
                                borderColor: 'rgb(255, 205, 86)',
                                backgroundColor: 'rgba(255, 205, 86, 0.2)',
                                tension: 0.3,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Blood Sugar Trend' }
                        }
                    }
                };

                // Liver & Kidney
                const altData = patientData.map(d => d.ALT);
                const creatinineData = patientData.map(d => d.Creatinine);
                const crpData = patientData.map(d => d.CRP);

                charts.liverKidney = {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: 'ALT',
                                data: altData,
                                borderColor: 'rgb(255, 99, 132)',
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                            {
                                label: 'Creatinine',
                                data: creatinineData,
                                borderColor: 'rgb(54, 162, 235)',
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                             {
                                label: 'CRP',
                                data: crpData,
                                borderColor: 'rgb(75, 192, 192)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                tension: 0.3,
                                fill: false
                            },
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: 'Liver & Kidney Health' }
                        }
                    }
                };
            };

            const createChartControlButtons = () => {
                chartControls.innerHTML = '';
                const chartKeys = {
                    'bp': 'Blood Pressure',
                    'hr': 'Heart Rate',
                    'weight': 'Weight',
                    'sleep': 'Sleep Duration',
                    'cholesterol': 'Cholesterol & Triglycerides',
                    'glucose': 'Blood Sugar',
                    'liverKidney': 'Liver & Kidney Health'
                };
                Object.keys(chartKeys).forEach(key => {
                    const button = document.createElement('button');
                    button.className = 'py-2 px-4 rounded-full font-medium text-sm bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors';
                    button.textContent = chartKeys[key];
                    button.dataset.chartId = key;
                    button.addEventListener('click', () => {
                        showChart(key);
                        // Update active button state
                        document.querySelectorAll('#chart-controls button').forEach(btn => {
                            btn.classList.remove('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                            btn.classList.add('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                        });
                        button.classList.remove('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                        button.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                    });
                    chartControls.appendChild(button);
                });
            };

            // --- Statistics Functions ---
            const calculateDoctorTotal = () => {
                const doctorTotals = {};
                conversationData.forEach(entry => {
                    for (const doctor in entry.doctor_durations) {
                        if (!doctorTotals[doctor]) {
                            doctorTotals[doctor] = 0;
                        }
                        doctorTotals[doctor] += entry.doctor_durations[doctor];
                    }
                });
                const totalValues = {};
                for (const doctor in doctorTotals) {
                    // No conversion needed, data is already in minutes
                    totalValues[doctor] = doctorTotals[doctor];
                }
                return totalValues;
            };

            const calculateWeeklyTotal = () => {
                const weeklyTotals = {};
                conversationData.forEach(entry => {
                    const date = new Date(entry.date);
                    const week = Math.floor(date.getDate() / 7);
                    if (!weeklyTotals[week]) {
                        weeklyTotals[week] = { total: 0 };
                    }
                    weeklyTotals[week].total += entry.total_duration;
                });
                const totalValues = {};
                for (const week in weeklyTotals) {
                    // No conversion needed, data is already in minutes
                    totalValues[`Week ${parseInt(week) + 1}`] = weeklyTotals[week].total;
                }
                return totalValues;
            };

            const calculateMonthlyTotal = () => {
                const monthlyTotals = {};
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                conversationData.forEach(entry => {
                    const date = new Date(entry.date);
                    const month = date.getMonth();
                    const monthName = monthNames[month];
                    if (!monthlyTotals[monthName]) {
                        monthlyTotals[monthName] = { total: 0 };
                    }
                    monthlyTotals[monthName].total += entry.total_duration;
                });
                const totalValues = {};
                for (const month in monthlyTotals) {
                    // No conversion needed, data is already in minutes
                    totalValues[month] = monthlyTotals[month].total;
                }
                return totalValues;
            };

            const showStats = (statId) => {
                statsContent.innerHTML = '';
                const titleElement = document.getElementById('stats-title');

                let data;
                let chartTitle;
                let chartLabels;
                let chartData;
                let contentHTML = '';

                // Destroy any existing chart
                if (currentChart) {
                    currentChart.destroy();
                    currentChart = null;
                }

                switch (statId) {
                    case 'doctor-total':
                        titleElement.textContent = 'Total Conversation Time per Doctor';
                        data = calculateDoctorTotal();
                        chartTitle = 'Total Conversation Time (minutes)';
                        chartLabels = Object.keys(data).map(name => expertDetails[name]?.name || name);
                        chartData = Object.values(data);
                        break;
                    case 'weekly-total':
                        titleElement.textContent = 'Weekly Total Conversation Time';
                        data = calculateWeeklyTotal();
                        chartTitle = 'Weekly Total Duration (minutes)';
                        chartLabels = Object.keys(data);
                        chartData = Object.values(data);
                        break;
                    case 'monthly-total':
                        titleElement.textContent = 'Monthly Total Conversation Time';
                        data = calculateMonthlyTotal();
                        chartTitle = 'Monthly Total Duration (minutes)';
                        chartLabels = Object.keys(data);
                        chartData = Object.values(data);
                        break;
                }

                contentHTML = `<div class="chart-container"><canvas id="stats-chart"></canvas></div>`;
                statsContent.innerHTML = contentHTML;

                currentChart = new Chart(document.getElementById('stats-chart'), {
                    type: 'bar',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: chartTitle,
                            data: chartData,
                            backgroundColor: 'rgba(59, 130, 246, 0.5)',
                            borderColor: 'rgb(59, 130, 246)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: chartTitle },
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            };

            const createStatsControlButtons = () => {
                statsControls.innerHTML = '';
                const statButtons = [
                    { id: 'doctor-total', text: 'Doctor Totals' },
                    { id: 'weekly-total', text: 'Weekly Totals' },
                    { id: 'monthly-total', text: 'Monthly Totals' }
                ];

                statButtons.forEach(btn => {
                    const button = document.createElement('button');
                    button.dataset.statId = btn.id;
                    button.className = 'py-2 px-4 rounded-full font-medium text-sm bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors';
                    button.textContent = btn.text;
                    button.addEventListener('click', () => {
                        showStats(btn.id);
                        document.querySelectorAll('#stats-controls button').forEach(b => {
                            b.classList.remove('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                            b.classList.add('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                        });
                        button.classList.remove('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                        button.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                    });
                    statsControls.appendChild(button);
                });
            };

            // --- Event Listeners ---
            decisionsToggleBtn.addEventListener('click', () => {
                decisionsPanel.classList.toggle('translate-x-full');
            });

            viewTrendsBtn.addEventListener('click', () => {
                generateChartData();
                createChartControlButtons();
                // Show BP chart by default
                showChart('bp');
                // Set the initial active button style
                const bpButton = document.querySelector('[data-chart-id="bp"]');
                if (bpButton) {
                    bpButton.classList.remove('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                    bpButton.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                }
                chartModal.classList.remove('hidden');
            });

            // Re-adding the event listener for the stats button.
            viewStatsBtn.addEventListener('click', () => {
                createStatsControlButtons();
                showStats('doctor-total');
                statsModal.classList.remove('hidden');
                // Set initial active button state
                const doctorTotalBtn = document.querySelector('[data-stat-id="doctor-total"]');
                if (doctorTotalBtn) {
                     doctorTotalBtn.classList.remove('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                     doctorTotalBtn.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                }
            });

            closeModalBtn.addEventListener('click', () => {
                chartModal.classList.add('hidden');
                destroyCurrentChart();
            });

            closeStatsModalBtn.addEventListener('click', () => {
                statsModal.classList.add('hidden');
                // Destroy chart if one is currently displayed in stats modal
                if (currentChart) {
                    currentChart.destroy();
                    currentChart = null;
                }
            });

            closeReasonBtn.addEventListener('click', () => {
                reasonModal.classList.add('hidden');
            });

            // Re-adding the event listener for stats controls.
            statsControls.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    const statId = e.target.dataset.statId;
                    showStats(statId);
                    document.querySelectorAll('#stats-controls button').forEach(b => {
                        b.classList.remove('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                        b.classList.add('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                    });
                    e.target.classList.remove('bg-gray-200', 'text-gray-800', 'dark:bg-slate-700', 'dark:text-gray-200');
                    e.target.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600');
                }
            });


            prevBtn.addEventListener('click', () => {
                const elements = searchInput.value ? searchResultElements : highlightedElements;
                let index = searchInput.value ? currentSearchIndex : currentHighlightIndex;

                if (index > 0) {
                    index--;
                    elements[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    if(searchInput.value) currentSearchIndex = index; else currentHighlightIndex = index;
                    updateNavControls();
                }
            });

            nextBtn.addEventListener('click', () => {
                const elements = searchInput.value ? searchResultElements : highlightedElements;
                let index = searchInput.value ? currentSearchIndex : currentHighlightIndex;

                if (index < elements.length - 1) {
                    index++;
                    elements[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    if(searchInput.value) currentSearchIndex = index; else currentHighlightIndex = index;
                    updateNavControls();
                }
            });

            searchInput.addEventListener('input', (e) => {
                handleSearch(e.target.value);
            });

            initializeApp();
        });
    </script>
</body>
</html>
